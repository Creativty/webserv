<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>404 Not Found</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #0f1724;
      color: #e6eef6;
    }
    .container {
      text-align: center;
      padding: 20px;
    }
    h1 {
      font-size: 3rem;
      margin: 0.5em 0;
    }
    p {
      color: #9aa4b2;
      max-width: 500px;
      margin: 0 auto;
    }
    .code {
      font-size: 5rem;
      font-weight: bold;
      color: #60a5fa;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="code">404</div>
    <h1>Page Not Found</h1>
    <p>The page you’re looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
  </div>
</body>
</html>
